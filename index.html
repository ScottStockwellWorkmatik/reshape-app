function tasksForRole(r){ return [...new Set(DATA.filter(d=>d.role===r).map(d=>d.task))]; }
function rIdxs(r){ return DATA.map((d,i)=>d.role===r?i:-1).filter(i=>i>=0); }
function tIdxs(r,t){ return DATA.map((d,i)=>(d.role===r&&d.task===t)?i:-1).filter(i=>i>=0); }
function stateOf(idxs){
  const sel = idxs.filter(i=>scope.has(i)).length;
  if(sel===0) return "none";
  if(sel===idxs.length) return "all";
  return "part";
}
function toggleIdxs(idxs){
  const st = stateOf(idxs);
  if(st==="all"){ idxs.forEach(i=>scope.delete(i)); }
  else { idxs.forEach(i=>scope.add(i)); }
}
function cls(i){ return ovr[i] || DATA[i].cls; }

function bapSetTab(t){
  currentTab = t;

  document.getElementById("plan").style.display = t==="plan" ? "flex" : "none";
  document.getElementById("dash").style.display = t==="dash" ? "block" : "none";

    const st = stateOf(idxs);

    const tickChar = st==="all"?"&#10003;":st==="part"?"&minus;":"";

}

function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function metrics(){
  const idxs = [...scope];
  const total = idxs.length;
  const counts = {}; counts[FA]=0; counts[AUG]=0; counts[HO]=0;
  idxs.forEach(i=>{ counts[cls(i)]++; });
  const pcts = {};
  [FA,AUG,HO].forEach(k=>{ pcts[k] = total? Math.round(counts[k]/total*100) : 0; });
  const scopedRoles = roles.filter(r=> rIdxs(r).some(i=>scope.has(i))).length;
  const overrideCount = Object.keys(ovr).length;
  return {total, counts, pcts, scopedRoles, totalRoles: roles.length, overrideCount};
}

function csvEscape(s){
  s = String(s);
  if(/[",\n]/.test(s)) return '"' + s.replace(/"/g,'""') + '"';
  return s;
}

function bapExport(){
  const idxs = [...scope].sort((a,b)=>a-b);
  if(idxs.length === 0){
    alert("No activities selected yet. Use the Activity Planner to select roles and activities, then export.");
    return;
  }
  const clientName = document.getElementById("clientName").value.trim();
  const headers = ["Client","Role","Role Type","Task","Activity","AI Suitability Classification","Overridden"];
  const rows = [headers];
  idxs.forEach(i=>{
    const d = DATA[i];
    const isOvr = !!ovr[i];
    rows.push([clientName, d.role, d.type, d.task, d.activity, cls(i), isOvr ? "Yes" : "No"]);
  });
  const csv = rows.map(r=>r.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob(["﻿" + csv], {type:"text/csv;charset=utf-8;"});
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  const ts = new Date().toISOString().slice(0,10);
  a.href = url;
  a.download = "Workmatik-RESHAPE-export-" + sanitizeFileToken(clientName) + "-" + ts + ".csv";
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}
window.bapExport = bapExport;

  const reader = new FileReader();

    let data;
    try {
      data = JSON.parse(e.target.result);
    } catch(err){
      alert("This file couldn't be read as a saved Workmatik RESHAPE progress file.");
      event.target.value = "";
      return;
    }
    if(!data || !Array.isArray(data.scope)){
      alert("This file doesn't look like a valid saved progress file.");
      event.target.value = "";
      return;
    }
    scope = new Set(data.scope.filter(i=>Number.isInteger(i) && i>=0 && i<DATA.length));

        const idx = parseInt(k,10);
        const val = data.overrides[k];
        if(Number.isInteger(idx) && idx>=0 && idx<DATA.length && [FA,AUG,HO].includes(val)){
          ovr[idx] = val;
        }
      });
    }
    document.getElementById("clientName").value = data.clientName || "";
    bapClientNameChange();
    vRole = null;
    vTask = null;
    currentTab = "plan";
    bapSetTab("plan");
    refresh();
    event.target.value = "";
  };
  reader.readAsText(file);
}
window.bapLoadFile = bapLoadFile;

function renderDash(){
  const el = document.getElementById("dash");
  const m = metrics();
  const totalActs = DATA.length;
  const cards = [
    {label:"Roles in Scope", val:m.scopedRoles, sub:'of ' + m.totalRoles + ' roles', pct: Math.round(m.scopedRoles/m.totalRoles*100)||0, accent:C.primary},
    {label:"Activities in Scope", val:m.total, sub:'of ' + totalActs + ' total activities', pct: Math.round(m.total/totalActs*100)||0, accent:C.blue},
    {label:"Full Automation", val:m.counts[FA]||0, sub:"of selected activities", pct:m.pcts[FA]||0, accent:C.darkblue},
{label:"Augmentation", val:m.counts[AUG]||0, sub:"of selected activities", pct:m.pcts[AUG]||0, accent:"#0C6E9E"},
{label:"Human Only", val:m.counts[HO]||0, sub:"of selected activities", pct:m.pcts[HO]||0, accent:C.primary},
  ];
  let h = '<div class="g4">';
  cards.forEach(c=>{
    h += '<div class="card" style="border-top-color:' + c.accent + '">' +
      '<div class="clabel">' + c.label + '</div>' +
      '<div class="cval">' + c.val + '</div>' +
      '<div class="csub">' + c.sub + '</div>' +
      '<div class="cbar"><div class="cbarfill" style="width:' + c.pct + '%;background:' + c.accent + '"></div></div>' +
      '<div class="cpct" style="color:' + c.accent + '">' + c.pct + '%</div>' +
      '</div>';
  });
  h += '</div>';

  h += '<div class="dgrid">';
  h += '<div class="panel"><div class="ptitle">AI Classification Breakdown</div>';
  if(m.total===0){
    h += '<div class="empty">No activities in scope yet. Use the Activity Planner to select roles and activities &mdash; then return here to see the breakdown.</div>';
  } else {
    [[FA,C.darkblue],[AUG,C.blue],[HO,C.primary]].forEach(([k,color])=>{
      h += '<div class="cbrow"><div class="cbrow-top"><span class="cbrow-label">' + k + '</span><span class="cbrow-val">' + (m.counts[k]||0) + ' (' + (m.pcts[k]||0) + '%)</span></div>' +
        '<div class="cbrow-bar"><div class="cbrow-fill" style="width:' + (m.pcts[k]||0) + '%;background:' + color + '"></div></div></div>';
    });
  }
  h += '</div>';

  h += '<div class="panel"><div class="ptitle">Activity Selection by Role</div>';
  roles.forEach(r=>{
    const idxs = rIdxs(r);
    const sel = idxs.filter(i=>scope.has(i)).length;
    const pct = Math.round(sel/idxs.length*100)||0;
    const isNew = roleType[r]==="New AI-enabled role";
    h += '<div class="rolebar"><div class="rolebar-top"><span class="rolebar-name">' + esc(r) + (isNew?'<span class="np">NEW</span>':'') + '</span><span class="rolebar-frac">' + sel + '/' + idxs.length + '</span></div>' +
      '<div class="rolebar-track"><div class="rolebar-fill" style="width:' + pct + '%"></div></div></div>';
  });
  h += '</div></div>';

  if(m.overrideCount > 0){
    h += '<div class="alert">' + m.overrideCount + ' activity classification' + (m.overrideCount===1?'':'s') + ' overridden from default.</div>';
  }
  el.innerHTML = h;
}

document.getElementById("bap").addEventListener("click", ev=>{
  const el = ev.target.closest("[data-act]");
  if(!el) return;
  const act = el.dataset.act;
  if(act==="vr"){ vRole=el.dataset.r; vTask=null; refresh(); }
  else if(act==="vt"){ vTask=el.dataset.t; renderActs(); }
  else if(act==="tr"){ toggleIdxs(rIdxs(el.dataset.r)); refresh(); }
  else if(act==="tt"){ toggleIdxs(tIdxs(el.dataset.r, el.dataset.t)); refresh(); }
  else if(act==="ta"){ const i=+el.dataset.i; scope.has(i)?scope.delete(i):scope.add(i); renderActs(); renderRoles(); renderTasks(); }
  else if(act==="sa"){ const idxs=tIdxs(vRole,vTask); toggleIdxs(idxs); refresh(); }
});

document.getElementById("bap").addEventListener("change", ev=>{
  if(ev.target.dataset.act==="ov"){
    const i = +ev.target.dataset.i;
    if(ev.target.value) ovr[i] = ev.target.value; else delete ovr[i];
    renderActs();
  }
});

function refresh(){
  renderRoles();
  renderTasks();
  renderActs();
  if(currentTab==="dash") renderDash();
}

refresh();
})();
</script>
</body>
</html>
